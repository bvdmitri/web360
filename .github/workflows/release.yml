name: Release

# One tag releases a version everywhere: pushing vX.Y.Z publishes @bvdmitri/web360 X.Y.Z to npm
# with provenance (npm trusted publishing, so no token is stored) and creates the GitHub Release
# from the version's CHANGELOG section. Safe to re-run: a version already on npm is not published
# again, and an existing Release is left alone. See docs/guide/releasing.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to the commit of the release named beside each.
jobs:
  release:
    name: Publish to npm and GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check the tag against the package and the changelog
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./packages/web360/package.json').version")"
          if [ "$version" != "$package" ]; then
            echo "The tag $GITHUB_REF_NAME does not match packages/web360/package.json ($package)." >&2
            exit 1
          fi
          node tools/release/src/main.ts "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@bvdmitri/web360@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
      - if: steps.version.outputs.published == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.published == 'false'
        run: pnpm verify
      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        working-directory: packages/web360
        run: npm publish --provenance --access public
      - name: Create the GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists."
          else
            gh release create "$GITHUB_REF_NAME" --title "web360 ${{ steps.version.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
