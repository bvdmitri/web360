name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Codecov's upload proves which repository it comes from with an OIDC token.
  id-token: write

# Actions are pinned to the commit of the release named beside each.
jobs:
  verify:
    name: Checks, typecheck, lint, format, dependency rules, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The WebGPU adapter's tests render on the GPU; the runner has none, so Mesa's software
      # Vulkan driver stands in.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # The documentation site builds, its links resolve, and the API reference has no warnings.
      - run: pnpm docs:build
      # Coverage goes to Codecov over OIDC (no token); an outage there never fails CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false
